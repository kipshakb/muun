<!doctype html>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: radial-gradient(ellipse at 50% 0%, #00264C 0%, #00172e 45%, #030712 100%);
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    main { position: relative; width: 100%; max-width: 640px; }
    .mark {
      width: min(180px, 44vw);
      height: auto;
      display: block;
      margin: 0 auto 32px;
      filter: drop-shadow(0 0 60px rgba(41, 120, 225, 0.35));
      animation: float 8s ease-in-out infinite;
    }
    .logo { width: min(260px, 64vw); height: auto; display: block; margin: 0 auto 40px; }
    .msg { margin: 0; }
    .msg + .msg { margin-top: 28px; padding-top: 28px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    h1, h2 {
      font-family: Montserrat, Inter, sans-serif;
      font-size: clamp(20px, 4.2vw, 26px);
      font-weight: 700;
      line-height: 1.25;
      color: #f8fafc;
      margin: 0;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/logo-crystal.png" alt="" width="824" height="900" />
    <img class="logo" src="/assets/logo-header.png" alt="MUUN26" width="1200" height="359" />

    <section class="msg" lang="ky">
      <h1>Сайт убактылуу жеткиликсиз</h1>
    </section>

    <section class="msg" lang="ru">
      <h2>Сайт временно недоступен</h2>
