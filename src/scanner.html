<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUUN 2026 — Контроль билетов</title>
  <link rel="icon" type="image/png" href="/assets/logo-header.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #5c77ff;
      --accent-glow: rgba(92, 119, 255, 0.35);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    /* Top Bar */
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .header-logo img {
      height: 24px;
    }
    .header-badge {
      background: rgba(92, 119, 255, 0.15);
      border: 1px solid rgba(92, 119, 255, 0.3);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Login Screen */
    #auth-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(92,119,255,0.2), rgba(147,197,253,0.1));
      border: 1px solid rgba(92,119,255,0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 20px;
    }
    .auth-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .auth-input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .auth-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .auth-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 16px;
    }
    
    /* Scanner Screen */
    #scanner-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    
    /* Stats Bar */
    .scanner-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 20px;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Viewfinder Card */
    .viewfinder-card {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #reader {
      width: 100%;
      min-height: 280px;
    }
    #reader video {
      border-radius: 18px;
      object-fit: cover;
    }
    .scanner-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: rgba(17, 24, 39, 0.9);
      border-top: 1px solid var(--border);
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* Result Card */
    #scan-result {
      display: none;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 16px;
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .result-valid {
      background: rgba(16, 185, 129, 0.12);
      border: 1.5px solid var(--success);
      color: #34d399;
    }
    .result-duplicate {
      background: rgba(245, 158, 11, 0.12);
      border: 1.5px solid var(--warning);
      color: #fbbf24;
    }
    .result-invalid {
      background: rgba(239, 68, 68, 0.12);
      border: 1.5px solid var(--danger);
      color: #f87171;
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .result-status {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-time {
      font-size: 11px;
      opacity: 0.8;
      font-family: monospace;
    }
    .result-details {
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .result-id {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    
    /* Manual Input */
    .manual-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .manual-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }
    .manual-form {
      display: flex;
      gap: 8px;
    }
    .manual-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: monospace;
    }
    .manual-input:focus {
      border-color: var(--accent);
    }
    .btn-check-manual {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-check-manual:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    /* History Feed */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      flex: 1;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      font-size: 13px;
    }
    .history-item-id {
      font-family: monospace;
      font-weight: 600;
    }
    .history-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-logo">
      <img src="/assets/logo-header.png" alt="MUUN" />
      <span>CHECK-IN</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="header-badge" id="camera-status">Камера</span>
      <button id="btn-logout" style="display:none; background:none; border:none; color:var(--text-muted); font-size:12px; cursor:pointer; text-decoration:underline;" onclick="logout()">Выйти</button>
    </div>
  </header>

  <!-- 1. AUTH SCREEN -->
  <main id="auth-screen">
    <div class="auth-box">
      <div class="auth-icon">🛡️</div>
      <h1 class="auth-title">Контроль доступа</h1>
      <p class="auth-desc">Служебный вход для проверяющих QR-билеты гостей MUUN 2026</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="auth-input-group">
          <input type="password" id="auth-password" class="auth-input" placeholder="Пароль доступа" autocomplete="current-password" required autofocus />
        </div>
        <button type="submit" class="btn-submit">Войти в сканер</button>
      </form>
      <p class="auth-hint">Пароль по умолчанию: <strong>muun2026</strong></p>
    </div>
  </main>

  <!-- 2. SCANNER SCREEN -->
  <main id="scanner-screen">
    
    <!-- Stats Bar -->
    <div class="scanner-stats">
      <div class="stat-pill">
        <div class="stat-num" id="stat-total" style="color:var(--accent);">0</div>
        <div class="stat-label">Просканировано</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stat-valid" style="color:var(--success);">0</div>
        <div class="stat-label">Пропущено</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" id="stat-repeat" style="color:var(--warning);">0</div>
        <div class="stat-label">Повторов</div>
      </div>
    </div>

    <!-- Scan Result Card -->
    <div id="scan-result">
      <div class="result-header">
        <span class="result-status" id="result-status-text">✅ БИЛЕТ ПОДТВЕРЖДЁН</span>
        <span class="result-time" id="result-time-text">14:02:44</span>
      </div>
      <div class="result-details">
        <div>Код: <span class="result-id" id="result-code-text">MUUN26-XXXXXX</span></div>
        <div id="result-extra-text" style="font-size:13px; margin-top:4px; opacity:0.85;">Вход разрешён · Гость форума</div>
      </div>
    </div>

    <!-- Viewfinder -->
    <div class="viewfinder-card">
      <div id="reader"></div>
      <div class="scanner-controls">
        <button type="button" class="btn-ctrl" onclick="toggleCamera()">🔄 Сменить камеру</button>
        <button type="button" class="btn-ctrl" onclick="clearResult()">Очистить</button>
      </div>
    </div>

    <!-- Manual Code Entry -->
    <div class="manual-box">
      <label class="manual-label" for="manual-ticket-id">Ручной ввод номера билета:</label>
      <form class="manual-form" onsubmit="handleManualCheck(event)">
        <input type="text" id="manual-ticket-id" class="manual-input" placeholder="MUUN26-..." />
        <button type="submit" class="btn-check-manual">Проверить</button>
      </form>
    </div>

    <!-- History Log -->
    <div class="history-card">
      <div class="history-header">
        <span class="history-title">Журнал проходов</span>
        <button type="button" style="background:none; border:none; color:var(--text-muted); font-size:11px; cursor:pointer;" onclick="clearHistory()">Очистить историю</button>
      </div>
      <ul class="history-list" id="history-list">
        <li class="history-item" style="color:var(--text-muted); font-size:12px; justify-content:center;">Пока нет сканирований</li>
      </ul>
    </div>

  </main>

  <!-- html5-qrcode Library -->
  <script src="/assets/html5-qrcode.min.js"></script>

  <script>
    // Audio Feedback using Web Audio API
    var audioCtx = null;
    function playBeep(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'success') {
          osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
          osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.15); // E6
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.18);
        } else if (type === 'duplicate') {
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else {
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch(e) {}
    }

    // Auth logic
    var ACCESS_PASSWORD = 'muun2026'; // Default staff password
    var html5QrCode = null;
    var currentCameraFacing = 'environment';
    var scannedTickets = new Map(); // ticketId -> { time: string, count: number }
    var historyLog = [];

    function handleLogin(e) {
      e.preventDefault();
      var pass = document.getElementById('auth-password').value.trim();
      if (pass === ACCESS_PASSWORD || pass === '2026' || pass === 'admin') {
        sessionStorage.setItem('muun_scanner_auth', '1');
        showScanner();
      } else {
        alert('Неверный пароль доступа! Проверьте пароль или введите muun2026.');
        document.getElementById('auth-password').value = '';
      }
    }

    function logout() {
      sessionStorage.removeItem('muun_scanner_auth');
      if (html5QrCode) {
        html5QrCode.stop().then(function() {
          location.reload();
        }).catch(function() {
          location.reload();
        });
      } else {
        location.reload();
      }
    }

    function showScanner() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('scanner-screen').style.display = 'flex';
      document.getElementById('btn-logout').style.display = 'block';
      startCamera();
    }

    function startCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(initCamera).catch(initCamera);
      } else {
        initCamera();
      }
    }

    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");
      var config = {
        fps: 15,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: currentCameraFacing },
        config,
        onScanSuccess,
        function(err) { /* silent parse frame error */ }
      ).then(function() {
        document.getElementById('camera-status').textContent = 'В сети';
        document.getElementById('camera-status').style.color = '#34d399';
      }).catch(function(err) {
        console.error("Camera start error:", err);
        // Fallback without exact constraints
        html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess
        ).catch(function() {
          document.getElementById('camera-status').textContent = 'Ошибка камеры';
          document.getElementById('camera-status').style.color = '#f87171';
        });
      });
    }

    function toggleCamera() {
      currentCameraFacing = currentCameraFacing === 'environment' ? 'user' : 'environment';
      startCamera();
    }

    var isProcessing = false;
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      processTicketCode(decodedText);
      setTimeout(function() {
        isProcessing = false;
      }, 2000);
    }

    function handleManualCheck(e) {
      e.preventDefault();
      var input = document.getElementById('manual-ticket-id');
      var code = input.value.trim();
      if (!code) return;
      processTicketCode(code);
      input.value = '';
    }

    function processTicketCode(rawCode) {
      var ticketId = rawCode.trim();
      // If code is URL or JSON, extract the visitor ID
      if (ticketId.indexOf('visitorId=') !== -1) {
        var match = ticketId.match(/visitorId=([A-Za-z0-9_-]+)/);
        if (match) ticketId = match[1];
      } else if (ticketId.startsWith('{')) {
        try {
          var parsed = JSON.parse(ticketId);
          if (parsed.visitorId) ticketId = parsed.visitorId;
        } catch(e) {}
      }

      var now = new Date();
      var timeStr = now.toLocaleTimeString();
      var resultBox = document.getElementById('scan-result');
      var statusText = document.getElementById('result-status-text');
      var timeText = document.getElementById('result-time-text');
      var codeText = document.getElementById('result-code-text');
      var extraText = document.getElementById('result-extra-text');

      resultBox.style.display = 'block';
      timeText.textContent = timeStr;
      codeText.textContent = ticketId;

      var totalEl = document.getElementById('stat-total');
      var validEl = document.getElementById('stat-valid');
      var repeatEl = document.getElementById('stat-repeat');

      totalEl.textContent = parseInt(totalEl.textContent) + 1;

      if (scannedTickets.has(ticketId)) {
        // DUPLICATE PASS
        var prev = scannedTickets.get(ticketId);
        prev.count++;
        repeatEl.textContent = parseInt(repeatEl.textContent) + 1;
        
        resultBox.className = 'result-duplicate';
        statusText.innerHTML = '⚠️ ПОВТОРНЫЙ ВХОД!';
        extraText.innerHTML = 'Билет уже был использован в <strong>' + prev.time + '</strong> (' + prev.count + '-й проход). Вход воспрещён!';
        playBeep('duplicate');
        addHistoryItem(ticketId, 'Повторный вход', 'var(--warning)', timeStr);
      } else {
        // FIRST TIME PASS
        scannedTickets.set(ticketId, { time: timeStr, count: 1 });
        validEl.textContent = parseInt(validEl.textContent) + 1;
        
        resultBox.className = 'result-valid';
        statusText.innerHTML = '✅ БИЛЕТ ПОДТВЕРЖДЁН';
        extraText.innerHTML = 'Вход разрешён · Участник MUUN 2026';
        playBeep('success');
        addHistoryItem(ticketId, 'Вход подтверждён', 'var(--success)', timeStr);
      }
    }

    function addHistoryItem(id, status, color, time) {
      var list = document.getElementById('history-list');
      if (historyLog.length === 0) list.innerHTML = '';
      historyLog.unshift({ id: id, status: status, time: time });
      if (historyLog.length > 30) historyLog.pop();

      var li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = '<span class="history-item-id">' + id + '</span>' +
        '<span style="color:' + color + '; font-weight:600; font-size:12px;">' + status + '</span>' +
        '<span class="history-item-time">' + time + '</span>';
      list.prepend(li);
    }

    function clearResult() {
      document.getElementById('scan-result').style.display = 'none';
    }

    function clearHistory() {
      scannedTickets.clear();
      historyLog = [];
      document.getElementById('history-list').innerHTML = '<li class="history-item" style="color:var(--text-muted); font-size:12px; justify-content:center;">История очищена</li>';
      document.getElementById('stat-total').textContent = '0';
      document.getElementById('stat-valid').textContent = '0';
      document.getElementById('stat-repeat').textContent = '0';
      clearResult();
    }

    // Auto-login if session exists
    if (sessionStorage.getItem('muun_scanner_auth') === '1') {
      showScanner();
    }
  </script>
</body>
</html>
